# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  # Manual only: the matrix builds the C++ core on three OSes across five
  # Python versions, which is too heavy to spend on every push.
  workflow_dispatch:

jobs:
  tests:
    strategy:
      # let every OS report independently
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        # submodules: the C++ core cannot build without extern/{armadillo,carma,pybind11}
        # fetch-depth: setuptools-scm needs the tags to compute the version
        submodules: recursive
        fetch-depth: 0
    - name: Install BLAS (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
    - name: Install OpenBLAS (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # The nuget OpenBLAS package (as used by mlpack's CI) bundles the
        # LAPACK routines in the same library; vcpkg's openblas is BLAS-only
        # and there is no system LAPACK on Windows. Reshape the import
        # library into a lib/ layout that find_package(BLAS) searches.
        nuget install OpenBLAS -ExcludeVersion -o C:\openblas
        New-Item -ItemType Directory -Force C:\openblas-prefix\lib | Out-Null
        Copy-Item C:\openblas\OpenBLAS\lib\native\lib\x64\libopenblas.dll.a C:\openblas-prefix\lib\openblas.lib
        Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=C:/openblas-prefix"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install ruptures
      run: |
        python -m pip install --upgrade pip
        python -m pip install "./python[test]"
    - name: Provide OpenBLAS DLLs (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Python >=3.8 ignores PATH when resolving an extension module's DLL
        # dependencies, so the DLLs must sit next to the package.
        $pkg = python -c "import importlib.util, os; print(os.path.dirname(importlib.util.find_spec('ruptures').origin))"
        Copy-Item C:\openblas\OpenBLAS\lib\native\bin\x64\*.dll $pkg
    - name: Test with pytest
      working-directory: python
      run: |
        python -m pytest --no-cov

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install BLAS (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install ruptures
      run: |
        python -m pip install --upgrade pip
        python -m pip install "./python[test,display]"
    - name: Test with pytest
      working-directory: python
      run: |
        python -m pytest --cov --cov-report=xml --cov-report=term:skip-covered
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      # env:
      #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./python/coverage.xml
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
    - uses: actions/upload-artifact@v4
      with:
        path: python/coverage.xml
